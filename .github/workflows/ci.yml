name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        if: hashFiles('tests/**/*.csproj') != ''
        run: >
          dotnet test --no-build --configuration Release
          --report-trx --results-directory TestResults
          --coverage --coverage-output-format cobertura

      - name: Upload test results
        if: always() && hashFiles('TestResults/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TaskHive.Web/Dockerfile
          load: true
          tags: taskhive:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and check the app renders
        run: |
          docker run -d --name taskhive -p 8080:8080 taskhive:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/ | grep -q "Plan, track and ship"; then
              echo "Landing page rendered"; exit 0
            fi
            sleep 2
          done
          docker logs taskhive
          exit 1
